[api]
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[auth]
site_url = "littlejourney://"
additional_redirect_urls = ["littlejourney://", "http://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.google]
enabled = false
client_id = ""
secret = ""

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[storage]
file_size_limit = "50MiB"

[realtime]
enabled = true

# ── Edge function gateway auth ──
# Stripe sends a stripe-signature header, NOT a Supabase JWT, so the default
# verify_jwt=true would 401 every webhook before the handler runs. The handler
# verifies the Stripe signature itself.
[functions.stripe-webhook]
verify_jwt = false

# Triggered by a Supabase DB webhook (no JWT). The function authorizes the call
# itself via the x-webhook-secret shared secret (or a staff JWT when present).
[functions.send-push]
verify_jwt = false
