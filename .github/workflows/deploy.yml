name: Build & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_native_builds:
        description: 'Run EAS native production builds'
        required: true
        type: boolean
        default: false

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  # ──────────────────────────────────────
  # Lint & Type Check
  # ──────────────────────────────────────
  check:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    outputs:
      has-expo-token: ${{ steps.token-check.outputs.available }}
    steps:
      - id: token-check
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint check
        # Fails on lint errors; warnings (e.g. no-explicit-any) do not fail CI.
        run: npm run lint

  # ──────────────────────────────────────
  # Tests
  # ──────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run Jest tests
        run: npx jest --ci --coverage
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://test.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: test-key
          EXPO_PUBLIC_ENV: test

  # ──────────────────────────────────────
  # Preview Build (PRs only — requires EXPO_TOKEN secret)
  # ──────────────────────────────────────
  preview:
    name: Preview Build
    runs-on: ubuntu-latest
    needs: [test, check]
    if: github.event_name == 'pull_request' && needs.check.outputs.has-expo-token == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build Android preview
        run: eas build --platform android --profile preview --non-interactive

      - name: Build iOS preview
        run: eas build --platform ios --profile preview --non-interactive
        continue-on-error: true

  # ──────────────────────────────────────
  # Production Build (manual release only — requires EXPO_TOKEN secret and EAS production env)
  # ──────────────────────────────────────
  production:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [test, check]
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_builds && needs.check.outputs.has-expo-token == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build Android production
        run: eas build --platform android --profile production --non-interactive

      - name: Build iOS production
        run: eas build --platform ios --profile production --non-interactive
        continue-on-error: true

  # ──────────────────────────────────────
  # OTA Update (manual release only — requires EXPO_TOKEN secret)
  # ──────────────────────────────────────
  update:
    name: OTA Update
    runs-on: ubuntu-latest
    needs: [test, check, production]
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_builds && needs.check.outputs.has-expo-token == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish OTA update
        run: eas update --branch production --message "${{ github.event.head_commit.message }}" --non-interactive
        continue-on-error: true
